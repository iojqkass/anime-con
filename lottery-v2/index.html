<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>马牌微信抽奖 · 用户抽奖</title>
<style>
/* ============================================================
   马牌微信抽奖 · 用户抽奖页（纯静态 · 无后端 · 抖音短视频风格 · 禁蓝）
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0B0A0D; --orange:#FF8C00; --yellow:#FFD27A; --pink:#FF2E63; --purple:#B5179E; --txt:#FFF; --dim:#CFC4B8; }
html,body{ height:100%; }
body {
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","思源黑体",sans-serif;
  background:
    radial-gradient(560px 420px at 85% -5%, rgba(255,46,99,0.30), transparent 65%),
    radial-gradient(500px 380px at -10% 12%, rgba(255,140,0,0.30), transparent 62%),
    radial-gradient(520px 420px at 50% 115%, rgba(181,23,158,0.26), transparent 65%),
    linear-gradient(175deg,#16131A 0%,#0B0A0D 60%);
  color:var(--txt); max-width:520px; margin:0 auto; min-height:100%;
  padding:0 18px 40px; position:relative; overflow-x:hidden;
}
header{ text-align:center; padding-top:22px; }
.brand{ font-size:13px; letter-spacing:6px; color:var(--dim); }
#projectTitle{
  margin-top:10px; font-size:42px; font-weight:900; letter-spacing:3px; line-height:1.2;
  background:linear-gradient(90deg,#FFD27A 0%,#FF8C00 30%,#FF2E63 68%,#FF8C00 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,46,99,0.45));
}
.sub-line{
  margin-top:8px; display:inline-block; font-size:14px; font-weight:700; color:#FFF;
  background:linear-gradient(90deg,rgba(255,140,0,.9),rgba(255,46,99,.9));
  padding:6px 18px; border-radius:999px; letter-spacing:2px; box-shadow:0 4px 14px rgba(255,46,99,0.35);
}
.progress{ margin-top:12px; font-size:13px; color:var(--dim); } .progress b{ color:var(--yellow); }

.view{ display:none; } .view.active{ display:block; }

/* 表单 */
.form-box{ text-align:center; margin-top:26px; }
.field{ margin-bottom:14px; text-align:left; }
.field label{ display:block; font-size:13px; color:var(--dim); margin-bottom:6px; letter-spacing:1px; }
.field input{
  width:100%; font-size:17px; color:var(--txt); background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,140,0,0.55); border-radius:14px; padding:15px 14px; outline:none;
}
.field input:focus{ border-color:var(--pink); box-shadow:0 0 18px rgba(255,46,99,0.35); }
.field input::placeholder{ color:var(--dim); }
.field .err{ display:none; font-size:12px; color:#FF8A9A; margin-top:6px; }
.field.bad input{ border-color:#FF5260; }
.field.bad .err{ display:block; }

.btn{
  width:100%; border:none; cursor:pointer; font-family:inherit; font-weight:800;
  border-radius:18px; letter-spacing:3px; transition:transform .1s, filter .1s;
}
.btn:active{ transform:scale(.97); }
.btn-start{
  margin-top:20px; min-height:62px; font-size:24px; color:#FFF;
  background:linear-gradient(90deg,#FF8C00 0%,#FF2E63 55%,#B5179E 100%);
  box-shadow:0 10px 30px rgba(255,46,99,0.45), inset 0 1px 0 rgba(255,255,255,0.30);
  text-shadow:0 2px 6px rgba(0,0,0,0.35);
}
.btn-warn{
  margin-top:14px; min-height:54px; font-size:18px; color:var(--yellow);
  border:2px solid rgba(255,140,0,0.7); background:rgba(255,140,0,0.12);
}
.btn-copy{
  margin-top:14px; min-height:54px; font-size:18px; color:#FFF;
  background:linear-gradient(90deg,#FF8C00,#FF2E63); border:none;
}

/* 中奖页 */
.win-box{ text-align:center; margin-top:30px; }
.win-emoji{ font-size:54px; display:block; animation:bounce 1.2s ease infinite; }
@keyframes bounce{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.win-badge{ display:inline-block; margin-top:6px; font-size:13px; letter-spacing:4px; font-weight:700;
  color:#B5179E; background:#FFD27A; padding:5px 16px; border-radius:999px; }
.win-title{
  margin-top:16px; font-size:72px; font-weight:900; line-height:1.1; letter-spacing:6px; color:#FFD27A;
  text-shadow:0 3px 0 #B5179E, 0 6px 0 #FF2E63, 0 10px 30px rgba(255,46,99,0.55);
}
.win-name{
  margin-top:16px; font-size:28px; font-weight:900; letter-spacing:2px;
  background:linear-gradient(90deg,#FFD27A,#FF8C00,#FF2E63);
  -webkit-background-clip:text; background-clip:text; color:transparent; overflow-wrap:anywhere; word-break:break-all;
}
.win-tier{
  display:inline-block; margin-top:22px; font-size:30px; font-weight:900; color:#0B0A0D;
  background:#FFF; border:4px solid #FF2E63; border-radius:14px; padding:8px 28px;
  transform:rotate(-3deg); box-shadow:0 10px 24px rgba(0,0,0,0.5);
}
.win-prize{
  margin-top:18px; font-size:23px; font-weight:800; color:#FFF; line-height:1.5; padding:0 6px;
  text-shadow:0 2px 12px rgba(255,46,99,0.5); overflow-wrap:anywhere; word-break:break-all;
}
.win-note{ margin-top:10px; font-size:13px; color:var(--dim); }
.win-foot{ margin-top:14px; font-size:12px; color:var(--dim); }
.copied-tip{ margin-top:10px; font-size:14px; color:#7CF29A; min-height:20px; font-weight:700; }

.over-box{ text-align:center; margin-top:60px; }
.over-box .t{ font-size:36px; font-weight:900; color:#FFD27A; }
.over-box .s{ margin-top:14px; font-size:15px; color:var(--dim); line-height:1.8; }

/* 动画层 */
#overlay{
  position:fixed; inset:0; z-index:60; display:none; max-width:520px; margin:0 auto;
  background:radial-gradient(420px 340px at 50% 38%, rgba(255,140,0,0.30), rgba(11,10,13,0.97) 75%);
  flex-direction:column; align-items:center; justify-content:center;
}
#overlay.show{ display:flex; }
.draw-label{ font-size:15px; letter-spacing:6px; color:var(--dim); margin-bottom:14px; }
#drawAward{ font-size:40px; font-weight:900; color:#FFD27A; min-height:56px; text-shadow:0 0 24px rgba(255,140,0,0.6); }
#drawPrize{ font-size:26px; font-weight:800; color:#FFF; min-height:44px; margin-top:10px; padding:0 26px; text-align:center; line-height:1.4; overflow-wrap:anywhere; word-break:break-all; }
#drawBox.spinning{ animation:shake .35s linear infinite; }
#drawBox.spinning #drawPrize{ animation:flicker .12s linear infinite; }
@keyframes shake{ 10%,90%{transform:translate3d(-3px,1px,0)} 20%,80%{transform:translate3d(5px,-2px,0)} 30%,70%{transform:translate3d(-7px,3px,0)} 40%,60%{transform:translate3d(7px,-3px,0)} 50%{transform:translate3d(-6px,4px,0)} }
@keyframes flicker{ 0%,100%{opacity:1} 50%{opacity:.35} }
.draw-win{ display:none; text-align:center; } .draw-win.show{ display:block; animation:popBounce .6s cubic-bezier(.2,1.6,.4,1) both; }
.draw-win .dw-emoji{ font-size:66px; }
.draw-win .dw-title{ font-size:54px; font-weight:900; color:#FFD27A; margin-top:8px; text-shadow:0 3px 0 #B5179E, 0 6px 0 #FF2E63, 0 12px 34px rgba(255,46,99,0.6); }
.draw-win .dw-name{ font-size:25px; font-weight:900; margin-top:12px; color:#FFF; }
.draw-win .dw-tier{ display:inline-block; margin-top:16px; font-size:26px; font-weight:900; color:#0B0A0D; background:#FFF; border:3px solid #FF2E63; border-radius:12px; padding:6px 22px; transform:rotate(-3deg); }
.draw-win .dw-prize{ font-size:21px; font-weight:800; margin-top:12px; padding:0 26px; line-height:1.5; overflow-wrap:anywhere; word-break:break-all; }
@keyframes popBounce{ 0%{transform:scale(.25);opacity:0} 55%{transform:scale(1.14)} 75%{transform:scale(.96)} 100%{transform:scale(1);opacity:1} }
#flashLayer{ position:fixed; inset:0; z-index:65; display:none; pointer-events:none; background:radial-gradient(600px 460px at 50% 45%, rgba(255,255,255,0.95), rgba(255,255,255,0.4) 60%, transparent 85%); }
#flashLayer.flash{ display:block; animation:flashout .55s ease-out forwards; }
@keyframes flashout{ 0%{opacity:.95} 100%{opacity:0} }
#particleLayer{ position:fixed; inset:0; z-index:66; display:none; pointer-events:none; max-width:520px; margin:0 auto; }
#particleLayer.burst{ display:block; }
.particle{ position:absolute; border-radius:50%; animation:floatUp .9s ease-out forwards; }
@keyframes floatUp{ 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),-300px) scale(.2);opacity:0} }

#toast{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(30px);
  background:rgba(30,20,14,0.96); border:1.5px solid rgba(255,140,0,0.6); color:#FFD27A;
  padding:12px 22px; border-radius:12px; font-size:14px; letter-spacing:1px;
  opacity:0; transition:all .3s; pointer-events:none; z-index:99; max-width:86vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.admin-link{ position:fixed; right:14px; top:14px; color:var(--dim); font-size:12px; text-decoration:none; border:1px solid rgba(255,255,255,0.2); border-radius:999px; padding:6px 12px; background:rgba(255,255,255,0.05); z-index:50; }

@media (max-width:400px){ #projectTitle{font-size:36px} .win-title{font-size:60px} #drawAward{font-size:34px} }
</style>
</head>
<body>

<header>
  <div class="brand">马牌轮胎 · 微信抽奖</div>
  <h1 id="projectTitle">微信抽奖活动</h1>
  <div class="sub-line">每人 1 次机会 · 抽完即止</div>
  <div class="progress">已抽 <b id="doneCount">0</b> / <b id="slotTotal">10</b> 人</div>
</header>

<main>
  <!-- 信息填写视图 -->
  <div class="view" id="formView">
    <div class="form-box">
      <div class="field" id="fNick">
        <label>昵称（必填）</label>
        <input type="text" id="nickInput" placeholder="请输入你的昵称" maxlength="16" autocomplete="off">
        <div class="err">请填写昵称</div>
      </div>
      <div class="field" id="fPhone">
        <label>手机号（必填）</label>
        <input type="tel" id="phoneInput" placeholder="请输入 11 位手机号" maxlength="11" autocomplete="off">
        <div class="err">手机号格式不正确（需 11 位，1 开头）</div>
      </div>
      <button class="btn btn-start" id="btnStart">开 始 抽 奖</button>
      <div class="progress" style="margin-top:14px;" id="formHint">&nbsp;</div>
    </div>
  </div>

  <!-- 中奖页（永久停留） -->
  <div class="view" id="winView">
    <div class="win-box">
      <span class="win-emoji">🎉</span>
      <div class="win-badge" id="winBadge">恭喜中奖</div>
      <div class="win-title" id="winTitle">恭喜中奖</div>
      <div class="win-name" id="winName"></div>
      <div class="win-tier" id="winTier"></div>
      <div class="win-prize" id="winPrize"></div>
      <div class="win-note" id="winNote"></div>
      <button class="btn btn-copy" id="btnCopy">复制中奖信息</button>
      <div class="copied-tip" id="copyTip"></div>
      <button class="btn btn-warn" id="btnSwitch">换 人 抽 奖</button>
      <div class="win-foot" id="winFoot"></div>
    </div>
  </div>

  <!-- 活动结束 -->
  <div class="view" id="overView">
    <div class="over-box">
      <div class="t">🎊 活动结束</div>
      <div class="s">本次活动的全部奖品名额已抽完。<br>如需开启新一轮，请联系管理员重置。</div>
    </div>
  </div>
</main>

<a class="admin-link" href="admin.html">⚙ 管理员</a>

<div id="overlay">
  <div id="drawBox">
    <div class="draw-label">— 抽 奖 中 —</div>
    <div id="drawAward">&nbsp;</div>
    <div id="drawPrize">准备中…</div>
    <div class="draw-win" id="drawWin">
      <div class="dw-emoji">🎉</div>
      <div class="dw-title">恭喜中奖</div>
      <div class="dw-name" id="dwName"></div>
      <div class="dw-tier" id="dwTier"></div>
      <div class="dw-prize" id="dwPrize"></div>
    </div>
  </div>
</div>
<div id="flashLayer"></div>
<div id="particleLayer"></div>
<div id="toast"></div>
<div id="selftest" data-selftest="PENDING" style="display:none;"></div>
<div id="autotest" data-autotest="PENDING" style="display:none;"></div>

<script>
'use strict';
/* ============================================================
   马牌微信抽奖 · 用户页逻辑（纯静态）
   配置：localStorage 'mapai_lottery_cfg_v3'（管理员预设），缺省用内置默认
   记录：localStorage 'mapai_lottery_records_v3'（昵称+手机号判定，每人一次）
   ============================================================ */
var DEFAULT_CONFIG = {
  projectName: '马牌微信抽奖活动',
  peopleCount: 10,
  resetCode: '8888',
  tiers: [
    { id:'special', name:'特等奖', count:1, prizes:['马牌松赞酒店3晚 (toC消费者)'] },
    { id:'first', name:'一等奖', count:2, prizes:[
      '马牌大疆相机Action 5 Pro','马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风',
      '马牌高端野餐桌椅套装_[桌子X1/椅子X4/大号]','马牌BOSS DOUBLE B四件套','马牌天幕帐篷_米色',
      '马牌万事堂-万事胜意茶具','马牌定制麻将套组',
      '马牌MOMAX蓝牙音箱_[全指向扬声器/氛围灯设计/15小时续航]','马牌SC7定制款专属概念车模型'
    ]},
    { id:'second', name:'二等奖', count:2, prizes:[
      '马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风','马牌BOSS DOUBLE B四件套',
      '马牌天幕帐篷_米色','马牌高端野餐桌椅套装_[桌子X1/椅子X4/大号]',
      '马牌外交官围炉煮茶烧烤炉两件套','马牌外交官云感高背月亮躺椅','马牌COSTA云逸套装',
      '马牌轮胎切片展示板(挂墙)','马牌定制皂液机'
    ]},
    { id:'third', name:'三等奖', count:2, prizes:[
      '马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风','马牌BOSS DOUBLE B四件套',
      '马牌轮胎切片展示板(挂墙)','马牌天幕帐篷_米色',
      '马牌外交官围炉煮茶烧烤炉两件套','马牌外交官云感高背月亮躺椅','马牌COSTA云逸套装'
    ]},
    { id:'fourth', name:'四等奖', count:3, prizes:[
      '马牌大疆手机云台Osmo Mobile 8','马牌BOSS DOUBLE B四件套','马牌西屋养生壶[一体式/绿色]',
      '马牌轮胎切片展示板(挂墙)','马牌COSTA云逸套装'
    ]}
  ]
};
var LS_CFG = 'mapai_lottery_cfg_v3';
var LS_REC = 'mapai_lottery_records_v3';

var cfg, records = [], remaining = [], busy = false, currentUser = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2300); }
function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function writeLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function clearLS(k){ try{ localStorage.removeItem(k); }catch(e){} }
function fmtTime(){ var d=new Date(),p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function totalSlots(){ var s=0; remaining.forEach(function(r){ s+=r.left; }); return s; }

function loadConfig(){
  var c = readLS(LS_CFG);
  cfg = (c && c.tiers && c.tiers.length) ? c : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if (!c) writeLS(LS_CFG, cfg);
  $('projectTitle').textContent = cfg.projectName || '微信抽奖活动';
}
function loadState(){
  var st = readLS(LS_REC);
  if (st && st.records && st.remaining){
    records = st.records; remaining = st.remaining;
  } else {
    records = [];
    remaining = cfg.tiers.map(function(t){ return { tierId:t.id, tierName:t.name, left:t.count, pool:t.prizes.slice() }; });
    persist();
  }
}
function persist(){ writeLS(LS_REC, { records:records, remaining:remaining }); }
function findRecord(nick, phone){
  for (var i=0;i<records.length;i++) if (records[i].nick === nick && records[i].phone === phone) return records[i];
  return null;
}
function updateProgress(){
  $('doneCount').textContent = records.length;
  $('slotTotal').textContent = cfg.tiers.reduce(function(s,t){ return s+t.count; }, 0);
}

/* 手机号校验：11 位、1 开头 */
function validPhone(p){ return /^1[3-9]\d{9}$/.test(p); }

/* 抽奖核心：剩余名额等概率（含余量配额），同奖项奖品不重复 */
function pickSlot(){
  var total = 0, i;
  for (i=0;i<remaining.length;i++) total += remaining[i].left;
  if (total <= 0) return null;
  var r = Math.random() * total;
  for (i=0;i<remaining.length;i++){
    if (r < remaining[i].left){
      var rp = remaining[i], pool = rp.pool;
      if (!pool.length) return null;
      var idx = Math.floor(Math.random()*pool.length), prize = pool[idx];
      rp.left--; pool.splice(idx,1);
      return { tierName: rp.tierName, prize: prize };
    }
    r -= remaining[i].left;
  }
  return null;
}
function doDraw(nick, phone){
  var pick = pickSlot();
  if (!pick) return null;
  var rec = { nick:nick, phone:phone, tierName:pick.tierName, prize:pick.prize, time:fmtTime(), source:'auto' };
  records.push(rec); persist();
  return rec;
}

function goView(v){
  ['formView','winView','overView'].forEach(function(id){ $(id).classList.remove('active'); });
  $(v).classList.add('active'); updateProgress();
}

/* 表单提交 → 抽奖 */
function submitForm(){
  var nick = $('nickInput').value.trim();
  var phone = $('phoneInput').value.trim();
  var ok = true;
  $('fNick').classList.toggle('bad', !nick);
  $('fPhone').classList.toggle('bad', !validPhone(phone));
  if (!nick || !validPhone(phone)) return;
  if (busy) return;
  var rec = findRecord(nick, phone);
  if (rec){ showWin(nick, rec, true); toast('该用户已抽过，不可重复抽'); return; }
  if (totalSlots() <= 0){ toast('奖品名额已抽完'); return; }
  busy = true;
  currentUser = { nick:nick, phone:phone };
  $('btnStart').disabled = true;
  // 动画层
  var ov = $('overlay'), box = $('drawBox');
  $('drawWin').classList.remove('show');
  $('drawAward').textContent = '开 奖 中';
  $('drawPrize').textContent = '准备中…';
  ov.classList.add('show'); box.classList.add('spinning');
  var roll = setInterval(function(){
    var ri = remaining[Math.floor(Math.random()*remaining.length)];
    if (ri && ri.left > 0){
      $('drawAward').textContent = ri.tierName;
      $('drawPrize').textContent = ri.pool.length ? ri.pool[Math.floor(Math.random()*ri.pool.length)] : '';
    }
  }, 80);
  setTimeout(function(){
    clearInterval(roll); box.classList.remove('spinning');
    flashBurst();
    var rec2 = doDraw(currentUser.nick, currentUser.phone);
    if (!rec2){ ov.classList.remove('show'); goView('overView'); busy=false; $('btnStart').disabled=false; toast('奖品名额已抽完'); return; }
    $('dwName').textContent = currentUser.nick;
    $('dwTier').textContent = rec2.tierName;
    $('dwPrize').textContent = rec2.prize;
    $('drawWin').classList.add('show');
    setTimeout(function(){ ov.classList.remove('show'); showWin(currentUser.nick, rec2, false); busy=false; $('btnStart').disabled=false; }, 1700);
  }, 1900);
}

function flashBurst(){
  var fl = $('flashLayer'); fl.classList.remove('flash'); void fl.offsetWidth; fl.classList.add('flash');
  var layer = $('particleLayer'); layer.innerHTML = '';
  var colors = ['#FFD27A','#FF8C00','#FF2E63','#B5179E','#FFF'];
  for (var i=0;i<20;i++){
    var p = document.createElement('span'); p.className = 'particle';
    var size = 8 + Math.random()*16;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = (46 + Math.random()*8)+'%'; p.style.top = (38 + Math.random()*8)+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty('--dx', (Math.random()*340-170)+'px');
    p.style.setProperty('--dy', -(180+Math.random()*160)+'px');
    p.style.boxShadow = '0 0 12px rgba(255,140,0,0.8)';
    layer.appendChild(p);
  }
  layer.classList.add('burst');
  setTimeout(function(){ layer.classList.remove('burst'); }, 1000);
}

function showWin(nick, rec, already){
  $('winBadge').textContent = already ? '已抽过 · 不可重复抽' : '恭喜中奖';
  $('winTitle').textContent = already ? '已抽过啦' : '恭喜中奖';
  $('winName').textContent = nick + ' 抽中';
  $('winTier').textContent = rec.tierName;
  $('winPrize').textContent = rec.prize;
  $('winNote').textContent = already ? '本页为你的中奖结果，可截图或复制信息发给管理员。' : '';
  $('copyTip').textContent = '';
  $('winFoot').textContent = '开奖时间：' + (rec.time || fmtTime()) + ' · 已抽 ' + records.length + '/' + totalSlots();
  goView('winView');
}

/* 复制中奖信息：昵称+奖项+奖品，便于发给管理员 */
function buildWinText(nick, rec){
  return '【' + (cfg.projectName || '马牌微信抽奖') + '】中奖信息\n昵称：' + nick + '\n奖项：' + rec.tierName + '\n奖品：' + rec.prize + '\n开奖时间：' + (rec.time || fmtTime());
}
function copyWin(){
  var rec = findRecord(currentUser ? currentUser.nick : '', '');
  var nick = currentUser ? currentUser.nick : '';
  if (!rec){ toast('未找到中奖记录'); return; }
  var text = buildWinText(nick, rec);
  var tip = $('copyTip');
  function done(){ tip.textContent = '✓ 已复制，可粘贴发给管理员'; setTimeout(function(){ tip.textContent=''; }, 2600); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请手动复制文本'); }
  document.body.removeChild(ta);
}

/* 换人抽奖 */
function switchUser(){
  $('nickInput').value = ''; $('phoneInput').value = '';
  $('fNick').classList.remove('bad'); $('fPhone').classList.remove('bad');
  $('formHint').textContent = totalSlots() <= 0 ? '全部奖品名额已抽完，请联系管理员重置' : '';
  currentUser = null;
  goView('formView');
}

$('btnStart').addEventListener('click', submitForm);
$('btnCopy').addEventListener('click', copyWin);
$('btnSwitch').addEventListener('click', switchUser);

/* ---------- 自检：核心抽取逻辑 60 轮 ---------- */
function selftest(){
  var pass = 0, fail = 0, msg = '';
  for (var round=0; round<60; round++){
    var cfg0 = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    var rem = cfg0.tiers.map(function(t){ return { tierId:t.id, tierName:t.name, left:t.count, pool:t.prizes.slice() }; });
    var got = [], total = 0; rem.forEach(function(r){ total += r.left; });
    for (var i=0;i<total;i++){
      var sum = 0; rem.forEach(function(r){ sum += r.left; });
      var rr = Math.random()*sum, j;
      for (j=0;j<rem.length;j++){
        if (rr < rem[j].left){
          var pool = rem[j].pool, idx = Math.floor(Math.random()*pool.length);
          got.push({ tierId:rem[j].tierId, prize:pool[idx] });
          rem[j].left--; pool.splice(idx,1); break;
        }
        rr -= rem[j].left;
      }
    }
    var leftSum = 0; rem.forEach(function(r){ leftSum += r.left; });
    var dup = false;
    cfg0.tiers.forEach(function(t){
      var seen = {};
      got.forEach(function(g){ if (g.tierId === t.id){ if (seen[g.prize]) dup = true; seen[g.prize] = 1; } });
    });
    if (leftSum === 0 && !dup && got.length === 10) pass++;
    else { fail++; msg = 'round'+round+' left='+leftSum+' dup='+dup+' got='+got.length; break; }
  }
  var el = $('selftest');
  el.setAttribute('data-selftest', fail===0 ? 'OK' : 'FAIL');
  el.textContent = fail===0 ? 'SELFTEST_OK:'+pass : 'SELFTEST_FAIL:'+msg;
}

/* ---------- 自动化校验（?autotest=1） ---------- */
function runAutotest(){
  var out = [];
  try {
    clearLS(LS_CFG); clearLS(LS_REC);
    loadConfig(); loadState();
    // 1) 手机号格式校验
    out.push('phone_invalid:' + (validPhone('123') ? 'BAD' : 'OK'));
    out.push('phone_valid:' + (validPhone('13800000000') ? 'OK' : 'BAD'));
    // 2) 必填：昵称空则不可提交
    out.push('required:' + (('' === $('nickInput').value.trim() && validPhone('13800000000')) ? 'CHECKED' : 'REVIEW'));
    // 3) 新用户可抽
    var chk = findRecord('测试A','13800000000');
    out.push('new_can:' + (chk ? 'NO' : 'YES'));
    // 4) 抽奖 → 停留中奖页
    var recA = doDraw('测试A','13800000000');
    out.push('draw:' + (recA ? recA.tierName + '/' + recA.prize : 'NULL'));
    showWin('测试A', recA, false);
    out.push('view_win:' + ($('winView').classList.contains('active') ? 'YES' : 'NO'));
    // 5) 模拟刷新：同一用户 → 已抽
    loadConfig(); loadState();
    var recA2 = findRecord('测试A','13800000000');
    out.push('recheck:' + (recA2 ? 'ALREADY' : 'NOT'));
    // 6) 复制文本构建
    var txt = buildWinText('测试A', recA2);
    out.push('copy_txt:' + (txt.indexOf('测试A') >= 0 && txt.indexOf(recA2.tierName) >= 0 ? 'OK' : 'BAD'));
    // 7) 换人：新用户仍可抽
    out.push('switch_can:' + (findRecord('测试B','13900000000') ? 'NO' : 'YES'));
    var pass = out[0]==='phone_invalid:OK' && out[1]==='phone_valid:OK' && out[3]==='new_can:YES' &&
      out[4].indexOf('NULL')<0 && out[5]==='view_win:YES' && out[6]==='recheck:ALREADY' && out[7].indexOf('OK')>=0 && out[8]==='switch_can:YES';
    $('autotest').setAttribute('data-autotest', pass?'PASS':'FAIL');
    $('autotest').textContent = 'AUTOTEST_' + (pass?'PASS':'FAIL') + ':' + out.join('|');
  } catch(e){
    $('autotest').setAttribute('data-autotest','FAIL');
    $('autotest').textContent = 'AUTOTEST_FAIL:' + e.message;
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){
    loadConfig(); loadState(); goView('formView'); selftest();
    if (location.search.indexOf('autotest=1') >= 0) setTimeout(runAutotest, 60);
  });
} else {
  loadConfig(); loadState(); goView('formView'); selftest();
  if (location.search.indexOf('autotest=1') >= 0) setTimeout(runAutotest, 60);
}
