<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马牌抽奖管理后台</title>
<style>
/* ============================================================
   马牌抽奖管理后台 v2 · 多抽奖项目管理（纯静态 · 手动登记版）
   - 新建抽奖 / 已发布项目列表 / 开关 / 下载CSV / 复制 / 删除
   ============================================================ */
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0D0906; color:#FFF; max-width:900px; margin:0 auto; padding:0 18px 60px;
}
header{ padding:26px 0 16px; text-align:center; }
.brand{ font-size:13px; letter-spacing:6px; color:#9A9184; }
h1{
  margin-top:8px; font-size:38px; font-weight:900; letter-spacing:3px;
  background:linear-gradient(90deg,#FFD27A,#FF8C00,#FF2E63,#FF8C00);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.note{ margin-top:10px; display:inline-block; font-size:12px; color:#FFD27A; border:1px dashed rgba(255,140,0,.5); border-radius:8px; padding:6px 14px; letter-spacing:1px; }
.section{ margin-top:26px; }
.section-title{
  font-size:20px; font-weight:800; letter-spacing:2px; margin-bottom:14px; padding-left:10px;
  border-left:4px solid #FF2E63; color:#FFD27A;
}
.card{
  background:rgba(255,255,255,0.045); border:1.5px solid rgba(255,140,0,0.35);
  border-radius:16px; padding:18px; margin-bottom:14px;
}
label{ display:block; font-size:13px; color:#9A9184; margin:12px 0 6px; letter-spacing:1px; }
input[type=text],input[type=number],input[type=tel],select,textarea{
  width:100%; font-size:15px; color:#FFF; background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,140,0,0.45); border-radius:10px; padding:11px 12px; outline:none; font-family:inherit;
}
input:focus,select:focus,textarea:focus{ border-color:#FF2E63; box-shadow:0 0 14px rgba(255,46,99,.3); }
textarea{ min-height:74px; resize:vertical; line-height:1.5; }
.btn{
  border:none; cursor:pointer; font-family:inherit; font-weight:800; border-radius:12px;
  letter-spacing:1px; transition:transform .1s; padding:12px 20px; font-size:15px;
}
.btn:active{ transform:scale(.96); }
.btn-main{ background:linear-gradient(90deg,#FF8C00,#FF2E63); color:#FFF; box-shadow:0 6px 18px rgba(255,46,99,.4); }
.btn-ghost{ background:rgba(255,255,255,0.08); color:#FFD27A; border:1.5px solid rgba(255,140,0,.5); }
.btn-danger{ background:linear-gradient(90deg,#FF3D00,#FF2E63); color:#FFF; }
.btn-sm{ padding:7px 12px; font-size:13px; }
.row{ display:flex; gap:12px; flex-wrap:wrap; } .row>*{ flex:1; min-width:150px; }
.mt{ margin-top:14px; } .mt8{ margin-top:8px; }

/* 奖项行 */
.tier-row{ background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px; margin-bottom:10px; }
.tier-row .head{ display:flex; gap:10px; align-items:center; margin-bottom:8px; }
.tier-row .head input{ flex:1; }
.tier-row .head .count{ max-width:110px; }

/* 项目卡片 */
.proj-card{ background:linear-gradient(145deg, rgba(255,140,0,0.09), rgba(255,46,99,0.07)); border:1.5px solid rgba(255,140,0,0.5); border-radius:16px; padding:16px; margin-bottom:16px; }
.proj-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.proj-name{ font-size:19px; font-weight:900; letter-spacing:1px; color:#FFF; overflow-wrap:anywhere; }
.tag{ font-size:12px; font-weight:800; padding:5px 12px; border-radius:999px; letter-spacing:1px; }
.tag.on{ background:linear-gradient(90deg,#FF8C00,#FF2E63); color:#FFF; }
.tag.off{ background:rgba(255,255,255,0.1); color:#9A9184; border:1px solid rgba(255,255,255,0.2); }
.link-row{ display:flex; gap:8px; margin-top:12px; }
.link-row input{ flex:1; font-size:12px; padding:9px 10px; }
.stat-row{ margin-top:10px; font-size:13px; color:#9A9184; letter-spacing:1px; } .stat-row b{ color:#FFD27A; font-size:15px; }
.ops{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.recs{ margin-top:16px; border-top:1px dashed rgba(255,255,255,0.15); padding-top:12px; }
.rec-title{ font-size:14px; font-weight:800; color:#FFD27A; letter-spacing:1px; }
.rec-form{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.rec-form input,.rec-form select{ flex:1; min-width:130px; }
.rec-list{ margin-top:10px; }
.rec-item{ display:flex; gap:8px; align-items:center; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:8px 10px; margin-bottom:6px; font-size:13px; flex-wrap:wrap; }
.rec-item .info{ flex:1; min-width:200px; color:#DDD; line-height:1.5; }
.rec-item .info b{ color:#FFF; }
.rec-item .meta{ color:#9A9184; font-size:12px; }
.rec-item.editing input,.rec-item.editing select{ font-size:12px; padding:7px 8px; min-width:110px; }
.empty{ color:#9A9184; font-size:13px; padding:14px 0; text-align:center; }

/* 删除确认弹层 */
#mask{ position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:center; justify-content:center; z-index:90; padding:0 20px; }
#mask.show{ display:flex; }
.dialog{ background:#1A120B; border:2px solid rgba(255,140,0,0.55); border-radius:16px; padding:22px; width:100%; max-width:400px; }
.dialog h3{ color:#FF2E63; font-size:18px; margin-bottom:6px; letter-spacing:1px; }
.dialog p{ color:#9A9184; font-size:13px; margin-bottom:14px; line-height:1.6; }
.dialog .dbtns{ display:flex; gap:10px; margin-top:16px; }

#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(30px);
  background:rgba(26,18,11,0.97); border:1.5px solid rgba(255,140,0,0.6); color:#FFD27A;
  padding:11px 22px; border-radius:12px; font-size:14px; opacity:0; transition:all .3s; z-index:99; pointer-events:none;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand">马牌轮胎 · 管理端</div>
  <h1>抽奖活动管理后台</h1>
  <div class="note">手动登记版：自动收集参与记录需接云存储，当前为本地手动登记</div>
</header>

<!-- 功能一：新建抽奖 -->
<section class="section">
  <div class="section-title">① 新建抽奖</div>
  <div class="card">
    <div class="row">
      <div>
        <label>活动名称</label>
        <input type="text" id="newName" placeholder="如：马牌轮胎周年庆抽奖" maxlength="30">
      </div>
      <div>
        <label>参与人数（总名额）</label>
        <input type="number" id="newCount" min="1" max="999" value="10">
      </div>
      <div>
        <label>重置码（删除项目时确认用）</label>
        <input type="text" id="newCode" placeholder="如 8888" maxlength="16">
      </div>
    </div>
    <div class="mt"><button class="btn btn-ghost" id="btnTemplate">一键载入马牌默认模板</button></div>
    <div class="mt" id="tierWrap"></div>
    <div class="row mt8">
      <button class="btn btn-ghost" id="btnAddTier">+ 添加奖项</button>
      <button class="btn btn-main" id="btnCreate">保存并生成项目</button>
    </div>
  </div>
</section>

<!-- 功能二：已发布项目列表 -->
<section class="section">
  <div class="section-title">② 已发布项目列表（<span id="projCount">0</span>）</div>
  <div id="projList"><div class="empty">暂无已发布项目，请先在「新建抽奖」中创建。</div></div>
</section>

<!-- 删除确认弹层 -->
<div id="mask">
  <div class="dialog">
    <h3>删除项目</h3>
    <p>删除后将无法恢复。请输入该项目的重置码确认：</p>
    <input type="text" id="delCode" placeholder="重置码" maxlength="16">
    <div class="dbtns">
      <button class="btn btn-ghost" id="delCancel" style="flex:1">取消</button>
      <button class="btn btn-danger" id="delOk" style="flex:1">确认删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="selftest" data-selftest="PENDING" style="display:none;"></div>
<div id="autotest" data-autotest="PENDING" style="display:none;"></div>

<script>
'use strict';
/* ============================================================
   马牌抽奖管理后台 v2 · 多抽奖项目管理
   项目库：localStorage 'mapai_projects_v1'（数组）
   记录库：localStorage 'mapai_records_{projectId}' = {records:[]}
   ============================================================ */
var LS_PROJ = 'mapai_projects_v1';
var LS_REC = 'mapai_records_';
var MA_TEMPLATE = {
  name: '马牌微信抽奖活动',
  count: 10,
  code: '8888',
  tiers: [
    { name:'特等奖', count:1, prizes:['马牌松赞酒店3晚 (toC消费者)'] },
    { name:'一等奖', count:2, prizes:['马牌大疆相机Action 5 Pro','马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风','马牌高端野餐桌椅套装_[桌子X1/椅子X4/大号]','马牌BOSS DOUBLE B四件套','马牌天幕帐篷_米色','马牌万事堂-万事胜意茶具','马牌定制麻将套组','马牌MOMAX蓝牙音箱_[全指向扬声器/氛围灯设计/15小时续航]','马牌SC7定制款专属概念车模型'] },
    { name:'二等奖', count:2, prizes:['马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风','马牌BOSS DOUBLE B四件套','马牌天幕帐篷_米色','马牌高端野餐桌椅套装_[桌子X1/椅子X4/大号]','马牌外交官围炉煮茶烧烤炉两件套','马牌外交官云感高背月亮躺椅','马牌COSTA云逸套装','马牌轮胎切片展示板(挂墙)','马牌定制皂液机'] },
    { name:'三等奖', count:2, prizes:['马牌大疆手机云台Osmo Mobile 8','马牌大疆DJI Mic Mini迷你麦克风','马牌BOSS DOUBLE B四件套','马牌轮胎切片展示板(挂墙)','马牌天幕帐篷_米色','马牌外交官围炉煮茶烧烤炉两件套','马牌外交官云感高背月亮躺椅','马牌COSTA云逸套装'] },
    { name:'四等奖', count:3, prizes:['马牌大疆手机云台Osmo Mobile 8','马牌BOSS DOUBLE B四件套','马牌西屋养生壶[一体式/绿色]','马牌轮胎切片展示板(挂墙)','马牌COSTA云逸套装'] }
  ]
};
var projects = [], deletingId = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2400); }
function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function writeLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function fmtTime(){ var d=new Date(),p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function genId(){ return 'p' + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36); }
function recKey(pid){ return LS_REC + pid; }
function loadRecords(pid){ var v = readLS(recKey(pid)); return (v && v.records) ? v.records : []; }
function saveRecords(pid, recs){ writeLS(recKey(pid), { records: recs }); }

/* ---------- 项目库 ---------- */
function loadProjects(){ projects = readLS(LS_PROJ) || []; }
function persistProjects(){ writeLS(LS_PROJ, projects); }

/* ---------- 新建抽奖 ---------- */
function tierHTML(t){
  return '<div class="tier-row" data-t="' + (t&&t._k?t._k:'') + '">' +
    '<div class="head">' +
    '<input type="text" class="tName" placeholder="奖项名称（如 一等奖）" value="' + esc(t?t.name:'') + '">' +
    '<input type="number" class="tCount" min="1" max="99" placeholder="数量" value="' + (t?t.count:'') + '">' +
    '<button class="btn btn-danger btn-sm tDel">删除</button></div>' +
    '<textarea class="tPrizes" placeholder="奖品池（每行一个奖品）">' + (t ? t.prizes.join('\n') : '') + '</textarea>' +
    '</div>';
}
function collectTiers(){
  var rows = document.querySelectorAll('.tier-row'), out = [];
  rows.forEach(function(r){
    var name = r.querySelector('.tName').value.trim();
    var count = parseInt(r.querySelector('.tCount').value, 10) || 0;
    var prizes = r.querySelector('.tPrizes').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    if (name && count > 0 && prizes.length) out.push({ name:name, count:count, prizes:prizes });
  });
  return out;
}
function renderTierEditor(list){
  var w = $('tierWrap'); w.innerHTML = '';
  list.forEach(function(t){ w.insertAdjacentHTML('beforeend', tierHTML(t)); });
  w.addEventListener('click', function(e){
    if (e.target.classList.contains('tDel')){ e.target.closest('.tier-row').remove(); }
  });
}
function loadTemplate(){
  $('newName').value = MA_TEMPLATE.name;
  $('newCount').value = MA_TEMPLATE.count;
  $('newCode').value = MA_TEMPLATE.code;
  renderTierEditor(MA_TEMPLATE.tiers);
  toast('已载入马牌默认模板');
}
function createProject(){
  var name = $('newName').value.trim();
  var count = parseInt($('newCount').value, 10) || 0;
  var code = $('newCode').value.trim() || '8888';
  var tiers = collectTiers();
  if (!name){ toast('请填写活动名称'); return; }
  if (count <= 0){ toast('请填写参与人数'); return; }
  if (!tiers.length){ toast('至少需要一个有效的奖项（名称/数量/奖品池）'); return; }
  var sum = 0; tiers.forEach(function(t){ sum += t.count; });
  if (sum > count){ toast('奖项名额之和(' + sum + ')超过参与人数(' + count + ')，请调整'); return; }
  var proj = { id:genId(), name:name, peopleCount:count, code:code, enabled:true, createdAt:fmtTime(), tiers:tiers };
  projects.unshift(proj); persistProjects();
  saveRecords(proj.id, []);
  $('newName').value=''; $('newCount').value='10'; $('newCode').value='';
  renderTierEditor([]);
  renderProjects();
  toast('项目已创建：' + name);
  return proj;
}
function projectURL(pid){
  var base = location.href.split('?')[0].split('#')[0];
  // 后台页复制出的链接必须指向用户抽奖页(index.html)，而非后台管理页(admin.html)
  base = base.replace(/(^|\/)admin\.html$/i, '$1index.html');
  return base + '?project=' + pid;
}
function copyText(txt, cb){
  var done = false;
  try{
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy'); document.body.removeChild(ta);
    if (ok){ cb && cb(); done = true; }
  }catch(e){}
  if (!done && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ cb && cb(); }).catch(function(){ toast('复制失败，请手动复制'); });
  } else if (!done){ toast('复制失败，请手动复制'); }
}

/* ---------- 项目列表渲染 ---------- */
function renderProjects(){
  $('projCount').textContent = projects.length;
  var el = $('projList');
  if (!projects.length){ el.innerHTML = '<div class="empty">暂无已发布项目，请先在「新建抽奖」中创建。</div>'; return; }
  el.innerHTML = projects.map(function(p){
    var recs = loadRecords(p.id);
    var tag = p.enabled ? '<span class="tag on">开启中</span>' : '<span class="tag off">已停止</span>';
    return '<div class="proj-card" data-id="' + p.id + '">' +
      '<div class="proj-head"><div class="proj-name">' + esc(p.name) + '</div>' + tag + '</div>' +
      '<div class="link-row"><input type="text" readonly value="' + esc(projectURL(p.id)) + '">' +
        '<button class="btn btn-ghost btn-sm bCopy">复制</button></div>' +
      '<div class="stat-row">抽奖情况：已抽 <b>' + recs.length + '</b> / 共 ' + p.peopleCount + ' 人 · 奖项 ' + p.tiers.length + ' 档 · 创建于 ' + esc(p.createdAt) + '</div>' +
      '<div class="ops">' +
        '<button class="btn btn-main btn-sm bToggle">' + (p.enabled ? '停止' : '开启') + '</button>' +
        '<button class="btn btn-ghost btn-sm bDl">下载表单</button>' +
        '<button class="btn btn-ghost btn-sm bDup">复制新项目</button>' +
        '<button class="btn btn-danger btn-sm bDel">删除</button>' +
      '</div>' +
      '<div class="recs"><div class="rec-title">参与记录（手动登记）</div>' +
        '<div class="rec-form">' +
          '<input type="text" class="rNick" placeholder="昵称（抖音昵称）" maxlength="16">' +
          '<input type="tel" class="rPhone" placeholder="手机号" maxlength="11">' +
          '<select class="rTier">' + p.tiers.map(function(t){ return '<option>' + esc(t.name) + '</option>'; }).join('') + '</select>' +
          '<input type="text" class="rPrize" placeholder="奖品" list="dl_' + p.id + '">' +
          '<datalist id="dl_' + p.id + '">' + p.tiers.map(function(t){ return t.prizes.map(function(pr){ return '<option value="' + esc(pr) + '"></option>'; }).join(''); }).join('') + '</datalist>' +
          '<button class="btn btn-main btn-sm rAdd">添加</button>' +
        '</div>' +
        '<div class="rec-list"></div>' +
      '</div>' +
    '</div>';
  }).join('');
  el.querySelectorAll('.proj-card').forEach(function(card){
    var pid = card.getAttribute('data-id');
    renderRecList(card, pid);
    card.querySelector('.bCopy').addEventListener('click', function(){
      copyText(projectURL(pid), function(){ toast('链接已复制'); });
    });
    card.querySelector('.bToggle').addEventListener('click', function(){ toggleProject(pid); });
    card.querySelector('.bDl').addEventListener('click', function(){ downloadCSV(pid); });
    card.querySelector('.bDup').addEventListener('click', function(){ duplicateProject(pid); });
    card.querySelector('.bDel').addEventListener('click', function(){ openDelDialog(pid); });
    card.querySelector('.rAdd').addEventListener('click', function(){ addRecord(card, pid); });
  });
}
function renderRecList(card, pid){
  var recs = loadRecords(pid);
  var box = card.querySelector('.rec-list');
  if (!recs.length){ box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = recs.map(function(r, i){
    return '<div class="rec-item" data-i="' + i + '">' +
      '<span class="info"><b>' + esc(r.nick) + '</b> · ' + esc(r.phone) + '<br>' +
      esc(r.tierName) + ' / ' + esc(r.prize) + '</span>' +
      '<span class="meta">' + esc(r.time) + '</span>' +
      '<button class="btn btn-ghost btn-sm rEdit">编辑</button>' +
      '<button class="btn btn-danger btn-sm rDel">删除</button>' +
      '</div>';
  }).join('');
  box.querySelectorAll('.rec-item').forEach(function(item){
    var i = parseInt(item.getAttribute('data-i'), 10);
    item.querySelector('.rDel').addEventListener('click', function(){
      var recs2 = loadRecords(pid); recs2.splice(i,1); saveRecords(pid, recs2); renderProjects(); toast('记录已删除');
    });
    item.querySelector('.rEdit').addEventListener('click', function(){ enterEdit(item, pid, i); });
  });
}
function enterEdit(item, pid, i){
  var recs = loadRecords(pid), r = recs[i];
  var tiers = projects.find(function(p){ return p.id === pid; }).tiers;
  item.classList.add('editing');
  item.innerHTML =
    '<input class="eNick" value="' + esc(r.nick) + '" maxlength="16">' +
    '<input class="ePhone" value="' + esc(r.phone) + '" maxlength="11">' +
    '<select class="eTier">' + tiers.map(function(t){ return '<option' + (t.name===r.tierName?' selected':'') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>' +
    '<input class="ePrize" value="' + esc(r.prize) + '">' +
    '<input class="eTime" value="' + esc(r.time) + '">' +
    '<button class="btn btn-main btn-sm eSave">保存</button>' +
    '<button class="btn btn-ghost btn-sm eCancel">取消</button>';
  item.querySelector('.eCancel').addEventListener('click', function(){ renderProjects(); });
  item.querySelector('.eSave').addEventListener('click', function(){
    var recs2 = loadRecords(pid);
    recs2[i] = {
      nick:item.querySelector('.eNick').value.trim() || r.nick,
      phone:item.querySelector('.ePhone').value.trim() || r.phone,
      tierName:item.querySelector('.eTier').value,
      prize:item.querySelector('.ePrize').value.trim() || r.prize,
      time:item.querySelector('.eTime').value.trim() || r.time
    };
    saveRecords(pid, recs2); renderProjects(); toast('记录已更新');
  });
}
function addRecord(card, pid){
  var nick = card.querySelector('.rNick').value.trim();
  var phone = card.querySelector('.rPhone').value.trim();
  var tier = card.querySelector('.rTier').value;
  var prize = card.querySelector('.rPrize').value.trim();
  if (!nick || !phone){ toast('昵称与手机号必填'); return; }
  if (!prize) prize = tier;
  var recs = loadRecords(pid);
  recs.push({ nick:nick, phone:phone, tierName:tier, prize:prize, time:fmtTime() });
  saveRecords(pid, recs);
  card.querySelector('.rNick').value=''; card.querySelector('.rPhone').value=''; card.querySelector('.rPrize').value='';
  renderProjects(); toast('记录已添加');
}

/* ---------- 项目操作 ---------- */
function toggleProject(pid){
  var p = projects.find(function(x){ return x.id === pid; });
  if (!p) return;
  p.enabled = !p.enabled; persistProjects(); renderProjects();
  toast(p.enabled ? '项目已开启' : '项目已停止（用户页将提示活动未开启）');
}
function duplicateProject(pid){
  var src = projects.find(function(x){ return x.id === pid; });
  if (!src) return;
  var copy = JSON.parse(JSON.stringify(src));
  copy.id = genId(); copy.name = src.name + '-副本'; copy.enabled = false;
  copy.createdAt = fmtTime();
  projects.unshift(copy); persistProjects(); saveRecords(copy.id, []);
  renderProjects(); toast('已复制新项目（默认停止，可手动开启）');
}
function openDelDialog(pid){
  deletingId = pid; $('delCode').value='';
  $('mask').classList.add('show'); $('delCode').focus();
}
function confirmDel(){
  if (!deletingId) return;
  var p = projects.find(function(x){ return x.id === deletingId; });
  var code = $('delCode').value.trim();
  if (!p){ $('mask').classList.remove('show'); deletingId=null; return; }
  if (code !== p.code){ toast('重置码错误，无法删除'); return; }
  projects = projects.filter(function(x){ return x.id !== deletingId; });
  persistProjects(); localStorage.removeItem(recKey(deletingId));
  deletingId = null; $('mask').classList.remove('show');
  renderProjects(); toast('项目已删除');
}

/* ---------- 下载 CSV ---------- */
function buildCSV(pid){
  var recs = loadRecords(pid);
  var head = '昵称,手机号,奖项,奖品,时间';
  var lines = recs.map(function(r){
    function q(s){ s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
    return [q(r.nick), q(r.phone), q(r.tierName), q(r.prize), q(r.time)].join(',');
  });
  return head + '\n' + lines.join('\n');
}
function downloadCSV(pid){
  var p = projects.find(function(x){ return x.id === pid; });
  var csv = buildCSV(pid);
  var name = (p ? p.name : pid) + '_参与记录.csv';
  try{
    var blob = new Blob([ '\ufeff' + csv ], { type:'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    toast('已导出：' + name);
  }catch(e){ toast('导出失败，可改用复制 CSV 内容'); }
}

/* ---------- 事件绑定 ---------- */
$('btnTemplate').addEventListener('click', loadTemplate);
$('btnAddTier').addEventListener('click', function(){ renderTierEditor(collectTiers().concat([{ name:'', count:1, prizes:[] }])); });
$('btnCreate').addEventListener('click', createProject);
$('delCancel').addEventListener('click', function(){ deletingId=null; $('mask').classList.remove('show'); });
$('delOk').addEventListener('click', confirmDel);

/* ---------- 自检 ---------- */
function selftest(){
  var pass = 0, fail = 0;
  for (var round=0; round<30; round++){
    var rem = MA_TEMPLATE.tiers.map(function(t){ return { name:t.name, left:t.count, pool:t.prizes.slice() }; });
    var got = [], total = 0; rem.forEach(function(r){ total += r.left; });
    for (var i=0;i<total;i++){
      var sum = 0; rem.forEach(function(r){ sum += r.left; });
      var rr = Math.random()*sum, j;
      for (j=0;j<rem.length;j++){
        if (rr < rem[j].left){
          var pool = rem[j].pool, idx = Math.floor(Math.random()*pool.length);
          got.push({ tier:rem[j].name, prize:pool[idx] }); rem[j].left--; pool.splice(idx,1); break;
        }
        rr -= rem[j].left;
      }
    }
    var leftSum = 0; rem.forEach(function(r){ leftSum += r.left; });
    var dup = false;
    MA_TEMPLATE.tiers.forEach(function(t){
      var seen = {};
      got.forEach(function(g){ if (g.tier === t.name){ if (seen[g.prize]) dup = true; seen[g.prize] = 1; } });
    });
    if (leftSum === 0 && !dup && got.length === 10) pass++; else { fail++; break; }
  }
  var el = $('selftest');
  el.setAttribute('data-selftest', fail===0 ? 'OK' : 'FAIL');
  el.textContent = fail===0 ? 'SELFTEST_OK:'+pass : 'SELFTEST_FAIL';
}

/* ---------- 自动化校验（?autotest=1） ---------- */
function runAutotest(){
  var out = [];
  try{
    localStorage.removeItem(LS_PROJ);
    ['pTest','pTestOff','pTestDup'].forEach(function(k){ localStorage.removeItem(recKey(k)); });
    loadProjects();
    // 1) 创建项目（模拟表单输入）
    $('newName').value = '校验测试活动';
    $('newCount').value = 10;
    $('newCode').value = '8888';
    renderTierEditor([{ name:'一等奖', count:2, prizes:['奖品甲','奖品乙'] }, { name:'二等奖', count:2, prizes:['奖品丙'] }]);
    var p1 = createProject();
    out.push('create:' + (p1 && p1.id ? 'OK' : 'BAD'));
    var pid = p1.id;
    out.push('enabled_default:' + (p1.enabled ? 'ON' : 'OFF'));
    // 2) 生成链接含 ?project=
    var url = projectURL(pid);
    out.push('url:' + (url.indexOf('?project=' + pid) >= 0 ? 'OK' : 'BAD'));
    // 3) 复制函数可执行（内部路径）
    out.push('copy_fn:' + (typeof copyText === 'function' ? 'OK' : 'BAD'));
    // 4) 开启/关闭切换
    toggleProject(pid);
    out.push('toggle_off:' + (!p1.enabled ? 'OFF' : 'BAD'));
    toggleProject(pid);
    out.push('toggle_on:' + (p1.enabled ? 'ON' : 'BAD'));
    // 5) 添加记录
    var card = document.querySelector('.proj-card[data-id="' + pid + '"]');
    card.querySelector('.rNick').value = '测试用户';
    card.querySelector('.rPhone').value = '13800000000';
    card.querySelector('.rTier').value = '一等奖';
    card.querySelector('.rPrize').value = '奖品甲';
    addRecord(card, pid);
    var recs = loadRecords(pid);
    out.push('add_rec:' + (recs.length === 1 && recs[0].nick === '测试用户' ? 'OK' : 'BAD'));
    // 6) 导出 CSV 内容
    var csv = buildCSV(pid);
    out.push('csv:' + (csv.indexOf('昵称,手机号,奖项,奖品,时间') >= 0 && csv.indexOf('测试用户,13800000000,一等奖,奖品甲') >= 0 ? 'OK' : 'BAD'));
    // 7) 复制新项目
    duplicateProject(pid);
    var dup = projects.find(function(x){ return x.id !== pid && x.name.indexOf('副本') >= 0; });
    out.push('dup:' + (dup ? 'OK' : 'BAD'));
    // 8) 删除：错误码拒绝 + 正确码删除
    deletingId = dup.id; $('delCode').value = '0000';
    confirmDel();
    out.push('del_wrong:' + (projects.find(function(x){ return x.id === dup.id; }) ? 'KEEP' : 'BAD'));
    deletingId = dup.id; $('delCode').value = dup.code;
    confirmDel();
    out.push('del_ok:' + (!projects.find(function(x){ return x.id === dup.id; }) ? 'DEL' : 'BAD'));
    // 9) 关闭项目供用户页校验未开启
    var offProj = { id:'pTestOff', name:'已停止测试活动', peopleCount:5, code:'0000', enabled:false, createdAt:fmtTime(), tiers:[{ name:'特等奖', count:1, prizes:['停用奖'] }] };
    projects.unshift(offProj); persistProjects(); saveRecords(offProj.id, []);
    out.push('off_proj:' + (offProj.enabled ? 'BAD' : 'READY'));
    // 10) 开启项目供用户页读取配置
    var onProj = { id:'pTest', name:'校验测试活动', peopleCount:10, code:'8888', enabled:true, createdAt:fmtTime(), tiers:[{ name:'一等奖', count:2, prizes:['奖品甲','奖品乙'] }, { name:'二等奖', count:2, prizes:['奖品丙'] }] };
    projects.unshift(onProj); persistProjects(); saveRecords(onProj.id, []);
    out.push('on_proj:' + (onProj.enabled ? 'READY' : 'BAD'));

    var pass = out[0]==='create:OK' && out[1]==='enabled_default:ON' && out[2].indexOf('url:OK')>=0 && out[3]==='copy_fn:OK' &&
      out[4]==='toggle_off:OFF' && out[5]==='toggle_on:ON' && out[6]==='add_rec:OK' && out[7].indexOf('csv:OK')>=0 &&
      out[8]==='dup:OK' && out[9]==='del_wrong:KEEP' && out[10]==='del_ok:DEL' && out[11]==='off_proj:READY' && out[12]==='on_proj:READY';
    $('autotest').setAttribute('data-autotest', pass?'PASS':'FAIL');
    $('autotest').textContent = 'AUTOTEST_' + (pass?'PASS':'FAIL') + ':' + out.join('|');
  }catch(e){
    $('autotest').setAttribute('data-autotest','FAIL');
    $('autotest').textContent = 'AUTOTEST_FAIL:' + e.message;
  }
}

loadProjects();
renderTierEditor(MA_TEMPLATE.tiers);
renderProjects();
selftest();
if (location.search.indexOf('autotest=1') >= 0) setTimeout(runAutotest, 80);
</script>
